short_bio: >-
  <p>
  I am Zhengxian Huang (黄郑献), a second-year Ph.D. candidate at the <a href="https://www.usslab.org/" target="_blank">Ubiquitous System Security Lab (USSLAB)</a>, Zhengjiang University, where I have been conducting research under the supervision of Prof. <a href=https://scholar.google.com/citations?user=FCsdj0YAAAAJ&hl target="_blank">Wenyuan Xu</a> and Prof. <a href=https://sites.google.com/site/xiaoyuijh/home target="_blank">Xiaoyu Ji</a>.
  </p>
  <p>
  My research interests primarily focus on <b>AI Security</b> and <b>Embodied AI</b>, with a particular emphasis on the security of embodied AI systems. My long-term research goal is to build safe, trustworthy, and robust embodied AI systems that can reliably interact with the physical world.
  </p>


